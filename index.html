
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TyphoonTracker｜颱風動態追蹤站</title>

<link rel="stylesheet"
 href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
* { box-sizing: border-box; }

:root {
  --bg: #0b1728;
  --card: rgba(13, 30, 50, .94);
  --text: #f0f7ff;
  --muted: #9fb3c8;
  --cyan: #38bdf8;
}

body {
  margin: 0;
  color: var(--text);
  font-family: "Noto Sans TC", Arial, sans-serif;
  background: var(--bg);
}

header {
  height: 68px;
  position: fixed;
  inset: 0 0 auto;
  z-index: 2000;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 25px;
  background: #0c1b2e;
  border-bottom: 1px solid #294057;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo {
  font-size: 30px;
  color: var(--cyan);
}

.brand h1 {
  font-size: 20px;
  margin: 0;
  letter-spacing: .5px;
}

.brand p, .update small {
  color: var(--muted);
  font-size: 11px;
  margin: 3px 0 0;
}

.update {
  text-align: right;
  font-size: 13px;
}

.mock-badge {
  display: inline-block;
  margin-top: 4px;
  padding: 3px 9px;
  font-size: 11px;
  border-radius: 20px;
  background: #334155;
  color: #fcd34d;
}

main {
  position: fixed;
  inset: 68px 0 0;
}

#map {
  position: absolute;
  inset: 0;
  z-index: 1;
  background: #a5d5e4;
}

/* 地圖工具 */
.map-tools {
  position: absolute;
  z-index: 800;
  top: 15px;
  left: 60px;
  display: flex;
  gap: 8px;
}

.map-tools button {
  border: 1px solid #38536d;
  background: #10263ce8;
  color: white;
  padding: 10px 14px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 13px;
}

.map-tools button:hover {
  background: #245271;
}

.legend {
  position: absolute;
  z-index: 800;
  left: 20px;
  bottom: 30px;
  padding: 16px 19px;
  border-radius: 14px;
  background: var(--card);
  box-shadow: 0 8px 28px #0003;
  font-size: 12px;
}

.legend strong {
  display: block;
  margin-bottom: 13px;
}

.legend-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 9px 0;
  color: #d9e6f2;
}

.line {
  width: 32px;
  border-top: 3px solid var(--cyan);
}

.line.future {
  border-top: 3px dashed #fbbf24;
}

.dot {
  width: 13px;
  height: 13px;
  background: #fb7185;
  border: 3px solid white;
  border-radius: 50%;
}

/* 資訊面板 */
.info-panel {
  position: absolute;
  z-index: 1000;
  top: 20px;
  right: 22px;
  bottom: 20px;
  width: 340px;
  overflow: hidden;
  border: 1px solid #43607a;
  border-radius: 20px;
  background: var(--card);
  backdrop-filter: blur(16px);
  box-shadow: 0 15px 45px #0005;
}

.drawer-toggle {
  display: none;
}

.info-content {
  height: 100%;
  overflow-y: auto;
  padding: 25px;
}

.eyebrow {
  color: var(--cyan);
  font-size: 12px;
  letter-spacing: 1.5px;
  font-weight: bold;
}

.info-content h2 {
  font-size: 27px;
  margin: 12px 0 4px;
}

.english {
  color: var(--muted);
  font-size: 13px;
}

.intensity {
  display: inline-block;
  margin: 18px 0 10px;
  padding: 7px 15px;
  border-radius: 30px;
  font-weight: bold;
  font-size: 13px;
}

.intensity.low {
  background: #075985;
  color: #bae6fd;
}

.intensity.medium {
  background: #854d0e;
  color: #fef08a;
}

.intensity.high {
  background: #881337;
  color: #fecdd3;
}

.divider {
  height: 1px;
  background: #344b62;
  margin: 22px 0;
}

.metrics {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.metric {
  padding: 16px 12px;
  background: #20364b;
  border-radius: 12px;
}

.metric-label {
  font-size: 11px;
  color: var(--muted);
}

.metric-value {
  font-size: 25px;
  font-weight: bold;
  margin-top: 10px;
}

.unit {
  font-size: 12px;
  font-weight: normal;
  color: var(--muted);
}

.section-title {
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 12px;
}

.detail-row {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin: 14px 0;
  font-size: 13px;
}

.detail-row span:first-child {
  color: var(--muted);
}

.notice {
  margin-top: 20px;
  padding: 12px;
  border: 1px solid #40556b;
  border-radius: 10px;
  color: #b7c8da;
  background: #203449;
  font-size: 11px;
  line-height: 1.8;
}

.empty-state {
  padding-top: 35px;
  text-align: center;
  line-height: 1.9;
  color: var(--muted);
}

[hidden] {
  display: none !important;
}

/* 颱風中心圖示 */
.storm-icon {
  background: transparent;
  border: none;
}

.storm-pin {
  position: relative;
  width: 38px;
  height: 38px;
  border: 3px solid white;
  border-radius: 50%;
  box-shadow: 0 3px 12px #0008;
  display: grid;
  place-items: center;
  background: #f59e0b;
}

.storm-pin.low { background: #0ea5e9; }
.storm-pin.medium { background: #f59e0b; }
.storm-pin.high { background: #e11d48; }

.storm-pin span {
  width: 10px;
  height: 10px;
  background: white;
  border-radius: 50%;
}

.storm-pin.selected {
  outline: 3px solid #fef08a;
  outline-offset: 3px;
}

.storm-pin::after {
  content: "";
  position: absolute;
  inset: -9px;
  border: 2px solid currentColor;
  border-radius: 50%;
  color: #f8fafc;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0% { transform: scale(.7); opacity: .9; }
  100% { transform: scale(1.4); opacity: 0; }
}

/* 手機版 */
@media (max-width: 640px) {
  header { padding: 0 15px; }

  .brand h1 { font-size: 16px; }
  .brand p { display: none; }
  .update { font-size: 10px; }

  .map-tools {
    top: 14px;
    left: 60px;
  }

  .map-tools button {
    padding: 9px;
    font-size: 11px;
  }

  .legend {
    top: 115px;
    bottom: auto;
    left: 12px;
    padding: 10px 13px;
  }

  .info-panel {
    top: auto;
    left: 10px;
    right: 10px;
    bottom: 10px;
    width: auto;
    height: min(54dvh, 480px);
    border-radius: 19px;
    transition: transform .3s ease;
  }

  .info-panel.collapsed {
    transform: translateY(calc(100% - 60px));
  }

  .drawer-toggle {
    display: flex;
    width: 100%;
    height: 60px;
    padding: 0 22px;
    justify-content: space-between;
    align-items: center;
    border: 0;
    background: #182e44;
    color: white;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
  }

  .info-content {
    height: calc(100% - 60px);
    padding: 20px;
  }
}
</style>
</head>

<body>

<header>
  <div class="brand">
    <div class="logo">◉</div>
    <div>
      <h1>TyphoonTracker</h1>
      <p>西北太平洋颱風動態追蹤站</p>
    </div>
  </div>

  <div class="update">
    <small>資料更新時間</small>
    <div id="headerTime">--</div>
    <span class="mock-badge">● 模擬資料模式</span>
  </div>
</header>

<main>
  <div id="map" aria-label="西北太平洋颱風互動地圖"></div>

  <div class="map-tools">
    <button id="homeBtn">回到台灣</button>
    <button id="allBtn">全部颱風</button>
  </div>

  <div class="legend">
    <strong>地圖圖例</strong>
    <div class="legend-row">
      <span class="dot"></span> 颱風中心
    </div>
    <div class="legend-row">
      <span class="line"></span> 歷史移動路徑
    </div>
    <div class="legend-row">
      <span class="line future"></span> 未來預測路徑
    </div>
  </div>

  <aside class="info-panel" id="infoPanel">

    <button class="drawer-toggle" id="drawerToggle"
      aria-controls="panelContent" aria-expanded="true">
      <span id="drawerLabel">颱風詳細資訊</span>
      <span id="drawerArrow">⌄</span>
    </button>

    <div class="info-content" id="panelContent">

      <div id="details">
        <div class="eyebrow">TYPHOON INFORMATION</div>
        <h2 id="stormName">--</h2>
        <div class="english" id="stormEnglish">--</div>

        <span class="intensity" id="stormLevel">--</span>

        <div class="divider"></div>

        <div class="section-title">目前颱風數據</div>

        <div class="metrics">
          <div class="metric">
            <div class="metric-label">近中心最大風速</div>
            <div class="metric-value">
              <span id="windSpeed">--</span>
              <span class="unit">m/s</span>
            </div>
          </div>

          <div class="metric">
            <div class="metric-label">中心氣壓</div>
            <div class="metric-value">
              <span id="pressure">--</span>
              <span class="unit">hPa</span>
            </div>
          </div>
        </div>

        <div class="divider"></div>

        <div class="section-title">位置與路徑</div>

        <div class="detail-row">
          <span>中心位置</span>
          <span id="position">--</span>
        </div>
        <div class="detail-row">
          <span>歷史觀測點</span>
          <span id="historyCount">--</span>
        </div>
        <div class="detail-row">
          <span>未來預測點</span>
          <span id="forecastCount">--</span>
        </div>
        <div class="detail-row">
          <span>資料時間</span>
          <span id="stormTime">--</span>
        </div>
      </div>

      <div id="emptyState" class="empty-state" hidden>
        <h2>目前沒有颱風資料</h2>
        <p>資料清單為空，請稍後查看或更新資料。</p>
      </div>

      <div class="notice">
        本網站目前使用模擬颱風資料，僅供課程展示。
        實際防颱資訊請以中央氣象署發布的官方資料為準。
      </div>

    </div>
  </aside>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>
// =======================================
// TyphoonTracker - JMA 即時資料版本
// =======================================

const API = "https://www.jma.go.jp/bosai/typhoon/data";
const $ = id => document.getElementById(id);
const badge = document.querySelector(".mock-badge");
const notice = document.querySelector(".notice");

// 地圖
const map = L.map("map", {
  zoomControl: true,
  minZoom: 2,
  maxZoom: 12
}).setView([23.5, 125.5], 5);

L.tileLayer(
  "https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png",
  {
    maxNativeZoom: 12,
    maxZoom: 12,
    attribution:
      '<a href="https://maps.gsi.go.jp/development/ichiran.html">' +
      '國土地理院</a>'
  }
).addTo(map);

const layer = L.layerGroup().addTo(map);
const markers = new Map();

let storms = [];
let selectedId = null;
let loading = false;
let lastAttempt = 0;

// ---------------------------------------
// 輔助函式
// ---------------------------------------

function formatTime(value) {
  const date = new Date(value);
  if (!value || isNaN(date.getTime())) return "—";

  return new Intl.DateTimeFormat("zh-TW", {
    timeZone: "Asia/Taipei",
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
    hour12: false
  }).format(date);
}

function toNumber(value) {
  if (value == null || String(value).trim() === "") return null;
  const n = Number(value);
  return Number.isFinite(n) ? n : null;
}

function validPoint(p) {
  return Array.isArray(p) &&
    p.length >= 2 &&
    Number.isFinite(Number(p[0])) &&
    Number.isFinite(Number(p[1])) &&
    Math.abs(Number(p[0])) <= 90 &&
    Math.abs(Number(p[1])) <= 180;
}

function intensity(wind) {
  if (wind === null) return "不明";
  if (wind < 17.2) return "熱帶性低氣壓";
  if (wind < 32.7) return "輕度";
  if (wind < 51) return "中度";
  return "強烈";
}

function levelClass(level) {
  if (level === "強烈") return "high";
  if (level === "中度") return "medium";
  return "low";
}

async function fetchJSON(path) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 12000);

  try {
    const response = await fetch(`${API}/${path}`, {
      signal: controller.signal
    });

    if (!response.ok)
      throw new Error(`HTTP ${response.status}: ${path}`);

    return await response.json();
  } finally {
    clearTimeout(timer);
  }
}

// ---------------------------------------
// 取得單一颱風
// ---------------------------------------

async function getTyphoon(tc) {
  const id = tc.tropicalCyclone;

  if (!/^TC\d{4}$/.test(id))
    throw new Error("颱風編號格式錯誤");

  const [spec, forecast] = await Promise.all([
    fetchJSON(`${id}/specifications.json`),
    fetchJSON(`${id}/forecast.json`)
  ]);

  if (!Array.isArray(spec) || !Array.isArray(forecast))
    throw new Error("颱風資料格式錯誤");

  const title = spec.find(p => p.part === "title") || {};

  const analysis = spec.find(
    p => p.part?.en === "Analysis" &&
         Number(p.advancedHours) === 0
  );

  if (!analysis) throw new Error("找不到颱風觀測資料");

  const current = analysis.position?.deg;

  if (!validPoint(current))
    throw new Error("颱風座標無效");

  const track = forecast.find(
    p => Number(p.advancedHours) === 0
  )?.track || {};

  const history = [
    ...(track.preTyphoon || []),
    ...(track.typhoon || [])
  ].filter(validPoint);

  const future = forecast
    .filter(p =>
      Number(p.advancedHours) > 0 &&
      validPoint(p.center)
    )
    .sort((a, b) => a.advancedHours - b.advancedHours)
    .map(p => p.center);

  const wind = toNumber(
    analysis.maximumWind?.sustained?.["m/s"]
  );

  const english = String(
    title.name?.en || tc.name?.en || "UNNAMED"
  ).toUpperCase();

  const number = String(tc.typhoonNumber || "");
  const stormNo = /^\d{4}$/.test(number)
    ? Number(number.slice(2)) : null;

  const nameZh = stormNo
    ? `第${stormNo}號颱風`
    : "熱帶性低氣壓";

  return {
    id,
    nameZh,
    nameEn: english,
    level: intensity(wind),
    wind,
    pressure: toNumber(analysis.pressure),
    current,
    history,
    forecast: future,
    issue: title.issue?.JST || tc.issue,
    observed: analysis.validtime?.JST || tc.issue
  };
}

// ---------------------------------------
// 繪製颱風標記及移動路徑
// ---------------------------------------

function drawTyphoon(storm) {
  const css = levelClass(storm.level);

  const icon = L.divIcon({
    className: "storm-icon",
    html: `<div class="storm-pin ${css}"><span></span></div>`,
    iconSize: [38, 38],
    iconAnchor: [19, 19]
  });

  const marker = L.marker(storm.current, {
    icon,
    title: storm.nameZh
  }).addTo(layer);

  const tooltip = document.createElement("span");
  tooltip.textContent = storm.nameZh;
  marker.bindTooltip(tooltip);

  marker.on("click", () => selectTyphoon(storm, true));
  markers.set(storm.id, marker);

  // 歷史路徑：藍色實線
  if (storm.history.length) {
    L.polyline([...storm.history, storm.current], {
      color: "#0284c7",
      weight: 4,
      opacity: 0.9
    }).addTo(layer);
  }

  // 預測路徑：黃色虛線
  if (storm.forecast.length) {
    L.polyline([storm.current, ...storm.forecast], {
      color: "#f59e0b",
      weight: 4,
      dashArray: "9, 10",
      opacity: 0.95
    }).addTo(layer);
  }

  storm.history.forEach(point => {
    L.circleMarker(point, {
      radius: 4,
      color: "#0284c7",
      fillColor: "white",
      fillOpacity: 1,
      weight: 2
    }).addTo(layer);
  });

  storm.forecast.forEach(point => {
    L.circleMarker(point, {
      radius: 5,
      color: "#f59e0b",
      fillColor: "white",
      fillOpacity: 1,
      weight: 2
    }).addTo(layer);
  });
}

// ---------------------------------------
// 顯示颱風詳細資訊
// ---------------------------------------

function selectTyphoon(storm, moveMap = false) {
  selectedId = storm.id;

  $("details").hidden = false;
  $("emptyState").hidden = true;

  $("stormName").textContent = storm.nameZh;
  $("stormEnglish").textContent = storm.nameEn;

  $("stormLevel").textContent =
    ["輕度", "中度", "強烈"].includes(storm.level)
      ? storm.level + "颱風"
      : storm.level;

  $("stormLevel").className =
    "intensity " + levelClass(storm.level);

  $("windSpeed").textContent = storm.wind ?? "—";
  $("pressure").textContent = storm.pressure ?? "—";

  $("position").textContent =
    storm.current[0].toFixed(1) + "°N, " +
    storm.current[1].toFixed(1) + "°E";

  $("historyCount").textContent =
    storm.history.length + " 個";

  $("forecastCount").textContent =
    storm.forecast.length + " 個";

  $("stormTime").textContent =
    formatTime(storm.observed);

  $("drawerLabel").textContent = storm.nameZh;

  markers.forEach((marker, id) => {
    const pin = marker.getElement()?.querySelector(".storm-pin");
    pin?.classList.toggle("selected", id === storm.id);
  });

  if (moveMap) {
    map.flyTo(storm.current, Math.max(map.getZoom(), 6));
    setCollapsed(false);
  }
}

// ---------------------------------------
// 顯示全部颱風
// ---------------------------------------

function showAllTyphoons() {
  if (!storms.length) return;

  const points = storms.flatMap(s => [
    ...s.history,
    s.current,
    ...s.forecast
  ]);

  map.fitBounds(L.latLngBounds(points), {
    padding: [45, 45],
    maxZoom: 6
  });
}

// ---------------------------------------
// 更新空資料或錯誤畫面
// ---------------------------------------

function showEmpty(title, description) {
  $("details").hidden = true;
  $("emptyState").hidden = false;

  $("emptyState").querySelector("h2").textContent = title;
  $("emptyState").querySelector("p").textContent = description;

  $("drawerLabel").textContent = title;
}

function clearStorms() {
  layer.clearLayers();
  markers.clear();
  storms = [];
  selectedId = null;
}

// ---------------------------------------
// 取得最新颱風資料
// ---------------------------------------

async function updateTyphoons() {
  if (loading) return;

  loading = true;
  lastAttempt = Date.now();
  badge.textContent = "● 正在取得 JMA 資料";

  try {
    const targets = await fetchJSON("targetTc.json");

    if (!Array.isArray(targets))
      throw new Error("颱風清單格式錯誤");

    const results = await Promise.allSettled(
      targets.map(getTyphoon)
    );

    const nextStorms = results
      .filter(r => r.status === "fulfilled")
      .map(r => r.value);

    const failures = results.filter(
      r => r.status === "rejected"
    ).length;

    if (targets.length && !nextStorms.length)
      throw new Error("所有颱風資料均讀取失敗");

    clearStorms();
    storms = nextStorms;

    storms.forEach(drawTyphoon);

    if (storms.length) {
      const selected =
        storms.find(s => s.id === selectedId) || storms[0];

      selectTyphoon(selected);

      const timestamps = storms
        .map(s => new Date(s.issue).getTime())
        .filter(Number.isFinite);

      const latest = timestamps.length
        ? Math.max(...timestamps) : null;

      $("headerTime").textContent =
        latest ? formatTime(latest) : "—";

      badge.textContent = failures
        ? "● JMA 部分資料取得失敗"
        : "● JMA 資料｜" + storms.length + " 個系統";

      showAllTyphoons();

    } else {
      $("headerTime").textContent =
        formatTime(new Date());

      badge.textContent = "● JMA｜目前無追蹤資料";

      showEmpty(
        "目前無追蹤中的颱風",
        "已成功查詢 JMA，目前清單沒有颱風資料。"
      );
    }

  } catch (error) {
    console.error("颱風資料更新失敗:", error);

    clearStorms();
    $("headerTime").textContent = "更新失敗";
    badge.textContent = "● 資料取得失敗";

    showEmpty(
      "無法取得最新資料",
      "請檢查網路、CORS 設定或 JMA 服務狀態。"
    );

  } finally {
    loading = false;
  }
}

// ---------------------------------------
// 地圖控制
// ---------------------------------------

$("homeBtn").addEventListener("click", () => {
  map.flyTo([23.7, 121], 6);
});

$("allBtn").addEventListener("click", showAllTyphoons);

// ---------------------------------------
// 手機版資訊抽屜
// ---------------------------------------

const panel = $("infoPanel");

function setCollapsed(collapsed) {
  panel.classList.toggle("collapsed", collapsed);

  $("drawerToggle").setAttribute(
    "aria-expanded", String(!collapsed)
  );

  $("drawerArrow").textContent =
    collapsed ? "⌃" : "⌄";
}

$("drawerToggle").addEventListener("click", () => {
  setCollapsed(!panel.classList.contains("collapsed"));
});

if (window.matchMedia("(max-width: 640px)").matches) {
  setCollapsed(true);
}
